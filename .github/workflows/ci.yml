name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check --select F src tests
      - name: Formatting
        run: ruff format --check tests
      - name: Unit tests
        run: pytest
